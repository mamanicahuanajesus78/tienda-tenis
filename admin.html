<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {background:#0f172a; color:white; padding:20px;}
        .login-box {max-width:420px; margin:60px auto; padding:35px; background:#1e293b; border-radius:16px; border:2px solid #22d3ee;}
        h2 {text-align:center; color:#22d3ee; margin-bottom:25px;}
        input {width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #22d3ee50; background:#0f172a; color:white; font-size:16px;}
        button {width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:8px;}
        .btn-entrar {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000;}
        .btn-guardar {background:linear-gradient(90deg,#10b981,#22c55e); color:#000;}
        .btn-borrar {background:#ef4444; color:white;}
        .btn-editar {background:#f59e0b; color:#000;}
        .panel {display:none; max-width:800px; margin:0 auto;}
        .aviso {background:#1e3a2f; border:1px solid #10b981; padding:15px; border-radius:10px; margin-bottom:20px; text-align:center; color:#10b981;}
        .form {background:#1e293b; padding:25px; border-radius:16px; margin-bottom:25px;}
        .item {background:#1e293b; padding:18px; border-radius:12px; margin-bottom:12px;}
        .acciones {display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
        .acciones button {flex:1; min-width:100px; padding:10px; font-size:14px;}
        .preview {max-width:120px; border-radius:8px; margin:10px 0; display:none;}
        .mensaje {text-align:center; margin:15px 0; padding:12px; border-radius:8px; display:none; font-weight:bold;}
        .exito {background:#1e3a2f; color:#10b981;}
        .error {background:#3b1f1f; color:#f87171;}
        .cargando {background:#2a2f3f; color:#fbbf24;}
        .volver {display:block; text-align:center; color:#22d3ee; margin-top:20px; text-decoration:none;}
        .cerrar {background:#334155; color:white; margin-top:30px;}
        .cancelar {background:#475569; color:white; margin-top:10px; display:none;}
    </style>
</head>
<body>

<div id="login" class="login-box">
    <h2>🔐 INICIAR SESIÓN</h2>
    <input type="text" id="usuario" placeholder="Tu usuario">
    <input type="password" id="clave" placeholder="Tu contraseña">
    <button class="btn-entrar" onclick="entrar()">ENTRAR</button>
    <p id="error-login" style="color:#ef4444; text-align:center; display:none;">Usuario o contraseña incorrectos</p>
    <a href="index.html" class="volver">← Volver a la tienda</a>
</div>

<div id="panel" class="panel">
    <h2>⚙️ PANEL DE ADMINISTRACIÓN</h2>
    <div class="aviso">✅ Todo se publica SOLO — no tocas nada más</div>
    
    <div id="mensaje" class="mensaje"></div>

    <div class="form">
        <h3 id="titulo-form">➕ AGREGAR NUEVO TENIS</h3>
        <input type="text" id="f-nombre" placeholder="Nombre del tenis">
        <input type="number" id="f-precio" placeholder="Precio en Bolivianos">
        <input type="number" id="f-talla" placeholder="Talla">
        <input type="file" id="f-foto" accept="image/*" onchange="verFoto(event)">
        <img id="foto-vista" class="preview">
        <button class="btn-guardar" id="btn-guardar" onclick="guardar()">💾 GUARDAR Y PUBLICAR</button>
        <button class="cancelar" id="btn-cancelar" onclick="cancelar()">❌ CANCELAR</button>
    </div>

    <h3 style="color:#22d3ee;">📋 LISTA DE TENIS</h3>
    <div id="lista"></div>

    <button class="cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    <a href="index.html" class="volver">← Volver a la tienda</a>
</div>

<script src="datos.js"></script>
<script>
let productos = [...DATOS_INICIALES];
let indiceEdicion = null;
let fotoBase64 = null;
let shaActual = null;

async function cargarSHA() {
    try {
        const resp = await fetch('https://api.github.com/repos/mamanicahuanajesus78/tienda-tenis/contents/datos.js?ref=main');
        if (resp.ok) {
            const data = await resp.json();
            shaActual = data.sha;
        }
    } catch (e) {
        console.log('No se pudo obtener SHA');
    }
}

function entrar() {
    const u = document.getElementById('usuario').value.trim();
    const c = document.getElementById('clave').value.trim();
    if (USUARIOS[u] && USUARIOS[u] === c) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        cargarSHA();
        mostrarLista();
    } else {
        document.getElementById('error-login').style.display = 'block';
        setTimeout(() => document.getElementById('error-login').style.display = 'none', 3000);
    }
}

function verFoto(e) {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        fotoBase64 = ev.target.result;
        document.getElementById('foto-vista').src = fotoBase64;
        document.getElementById('foto-vista').style.display = 'block';
    };
    r.readAsDataURL(f);
}

async function guardar() {
    const nombre = document.getElementById('f-nombre').value.trim();
    const precio = parseInt(document.getElementById('f-precio').value);
    const talla = parseInt(document.getElementById('f-talla').value);
    
    if (!nombre || !precio || !talla) { alert('Llena todos los datos'); return; }
    
    const imagen = fotoBase64 || (indiceEdicion !== null ? productos[indiceEdicion].imagen : null);
    if (!imagen) { alert('Elige una foto'); return; }

    if (indiceEdicion !== null) {
        productos[indiceEdicion] = { ...productos[indiceEdicion], nombre, precio, tallaUnica: talla, imagen };
        indiceEdicion = null;
        document.getElementById('titulo-form').textContent = '➕ AGREGAR NUEVO TENIS';
        document.getElementById('btn-cancelar').style.display = 'none';
    } else {
        productos.push({ id: Date.now(), nombre, precio, tallaUnica: talla, imagen, disponible: true });
    }

    const contenido = `// Última actualización: ${new Date().toLocaleString()}
const TU_WHATSAPP = "${TU_WHATSAPP}";
const USUARIOS = ${JSON.stringify(USUARIOS, null, 4)};
const DATOS_PAGO = ${JSON.stringify(DATOS_PAGO, null, 4)};
const DATOS_INICIALES = ${JSON.stringify(productos, null, 4)};`;

    mostrarMensaje('cargando', '⏳ Subiendo a internet...');

    try {
        const resp = await fetch('/.netlify/functions/actualizar-datos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contenido, sha: shaActual })
        });

        const res = await resp.json();
        
        if (res.ok) {
            shaActual = res.resultado.commit.sha;
            mostrarMensaje('exito', '✅ ¡Publicado! Tienda actualizada');
            limpiarFormulario();
            mostrarLista();
            setTimeout(() => ocultarMensaje(), 4000);
        } else {
            throw new Error('Error en la respuesta');
        }
    } catch (err) {
        mostrarMensaje('error', '❌ No se pudo publicar: ' + err.message);
    }
}

function mostrarMensaje(tipo, texto) {
    const m = document.getElementById('mensaje');
    m.className = `mensaje ${tipo}`;
    m.textContent = texto;
    m.style.display = 'block';
}

function ocultarMensaje() {
    document.getElementById('mensaje').style.display = 'none';
}

function cambiarEstado(i) {
    productos[i].disponible = !productos[i].disponible;
    mostrarLista();
}

function editar(i) {
    indiceEdicion = i;
    const p = productos[i];
    document.getElementById('f-nombre').value = p.nombre;
    document.getElementById('f-precio').value = p.precio;
    document.getElementById('f-talla').value = p.tallaUnica;
    fotoBase64 = p.imagen;
    document.getElementById('foto-vista').src = p.imagen;
    document.getElementById('foto-vista').style.display = 'block';
    document.getElementById('titulo-form').textContent = '✏️ EDITAR TENIS';
    document.getElementById('btn-cancelar').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
}

function cancelar() {
    indiceEdicion = null;
    limpiarFormulario();
    document.getElementById('titulo-form').textContent = '➕ AGREGAR NUEVO TENIS';
    document.getElementById('btn-cancelar').style.display = 'none';
}

function borrar(i) {
    if (!confirm('¿Seguro de borrar?')) return;
    productos.splice(i, 1);
    mostrarLista();
}

function limpiarFormulario() {
    document.getElementById('f-nombre').value = '';
    document.getElementById('f-precio').value = '';
    document.getElementById('f-talla').value = '';
    document.getElementById('f-foto').value = '';
    fotoBase64 = null;
    document.getElementById('foto-vista').style.display = 'none';
}

function mostrarLista() {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    productos.forEach((p, i) => {
        lista.innerHTML += `
        <div class="item">
            <h4 style="margin:0 0 6px 0; font-size:17px;">${p.nombre}</h4>
            <p style="color:#94a3b8; margin:4px 0;">Talla: ${p.tallaUnica} | Precio: ${p.precio} Bs</p>
            <p style="color:${p.disponible?'#10b981':'#ef4444'}; font-weight:bold;">
                ${p.disponible?'✅ DISPONIBLE':'❌ VENDIDO'}
            </p>
            <div class="acciones">
                <button style="background:${p.disponible?'#ef4444':'#10b981'}" onclick="cambiarEstado(${i})">
                    ${p.disponible?'Marcar VENDIDO':'Marcar DISPONIBLE'}
                </button>
                <button class="btn-editar" onclick="editar(${i})">✏️ EDITAR</button>
                <button class="btn-borrar" onclick="borrar(${i})">🗑️ BORRAR</button>
            </div>
        </div>`;
    });
}

function cerrarSesion() {
    document.getElementById('panel').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('usuario').value = '';
    document.getElementById('clave').value = '';
}
</script>
</body>
</html>

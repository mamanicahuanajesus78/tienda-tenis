<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Panel de Administración</title>
    <style>
        * {box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {background:#0f172a; color:white; padding:20px;}
        .caja {max-width:420px; margin:60px auto; padding:30px; background:#1e293b; border-radius:16px; border:2px solid #22d3ee;}
        h2 {text-align:center; color:#22d3ee;}
        input {width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #22d3ee50; background:#0f172a; color:white; font-size:16px;}
        button {width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:8px;}
        .btn-verde {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000;}
        .error {color:#ef4444; text-align:center; margin-top:15px; display:none;}
        .panel {display:none; max-width:800px; margin:0 auto;}
        .volver {display:block; text-align:center; color:#22d3ee; margin-top:20px; text-decoration:none;}
    </style>
</head>
<body>

<div id="pantalla-login" class="caja">
    <h2>🔐 INICIAR SESIÓN</h2>
    <input type="text" id="usuario" placeholder="Tu usuario">
    <input type="password" id="clave" placeholder="Tu contraseña">
    <button class="btn-verde" onclick="verificar()">ENTRAR</button>
    <p id="mensaje-error" class="error">Usuario o contraseña incorrectos</p>
    <a href="index.html" class="volver">← Volver a la tienda</a>
</div>

<div id="pantalla-panel" class="panel">
    <h2>✅ ¡YA ENTRASTE!</h2>
    <p>Si ves esto, ya funciona bien 🎉</p>
    <p>Estamos terminando de poner todo lo de agregar y editar tenis.</p>
    <a href="index.html" class="volver">← Ir a la tienda</a>
</div>

<script>
// TUS DATOS — AQUÍ ESTÁN, NO SE MUEVEN DE AQUÍ
const USUARIOS = {
  "jesus": "mamani",
  "yhubanneth": "71931423"
};

function verificar() {
    const u = document.getElementById('usuario').value.trim();
    const c = document.getElementById('clave').value.trim();
    
    if (USUARIOS[u] && USUARIOS[u] === c) {
        // Bien → mostramos el panel
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('pantalla-panel').style.display = 'block';
    } else {
        // Mal → mostramos error
        document.getElementById('mensaje-error').style.display = 'block';
        setTimeout(() => {
            document.getElementById('mensaje-error').style.display = 'none';
        }, 3000);
    }
}
</script>

</body>
</html>

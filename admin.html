<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {background:#0f172a; color:white; padding:20px;}
        .login-box {max-width:420px; margin:60px auto; padding:35px; background:#1e293b; border-radius:16px; border:2px solid #22d3ee;}
        h2 {text-align:center; color:#22d3ee; margin-bottom:25px;}
        input {width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #22d3ee50; background:#0f172a; color:white; font-size:16px;}
        button {width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:8px;}
        .btn-entrar {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000;}
        .panel {display:none; max-width:800px; margin:0 auto;}
        .volver {display:block; text-align:center; color:#22d3ee; margin-top:20px; text-decoration:none;}
        .error {color:#ef4444; text-align:center; margin-top:10px; display:none;}
    </style>
</head>
<body>

<div id="login" class="login-box">
    <h2>🔐 INICIAR SESIÓN</h2>
    <input type="text" id="usuario" placeholder="Tu usuario">
    <input type="password" id="clave" placeholder="Tu contraseña">
    <button class="btn-entrar" id="botonEntrar">ENTRAR</button>
    <p id="error-login" class="error">Usuario o contraseña incorrectos</p>
    <a href="index.html" class="volver">← Volver a la tienda</a>
</div>

<div id="panel" class="panel">
    <h2>✅ ¡BIENVENIDO!</h2>
    <p>Si ves esto, ya entraste correctamente 🎉</p>
    <a href="index.html" class="volver">← Ir a la tienda</a>
</div>

<script src="datos.js"></script>
<script>
// Conectamos el botón
document.getElementById('botonEntrar').addEventListener('click', entrar);

function entrar() {
    const u = document.getElementById('usuario').value.trim();
    const c = document.getElementById('clave').value.trim();
    
    console.log('Usuario escrito:', u);
    console.log('Contraseña escrita:', c);
    console.log('Usuarios permitidos:', USUARIOS);
    
    if (USUARIOS[u] && USUARIOS[u] === c) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        console.log('✅ Entró correctamente');
    } else {
        document.getElementById('error-login').style.display = 'block';
        setTimeout(() => {
            document.getElementById('error-login').style.display = 'none';
        }, 3000);
        console.log('❌ No entró');
    }
}
</script>
</body>
</html>

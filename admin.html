<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Tienda de Tenis — Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {background:#0f172a; color:white; padding:20px;}
        .login {max-width:420px; margin:60px auto; padding:35px; background:#1e293b; border-radius:16px; border:2px solid #22d3ee;}
        h2 {text-align:center; color:#22d3ee; margin-bottom:25px;}
        input {width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #22d3ee50; background:#0f172a; color:white; font-size:16px;}
        button {width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:8px;}
        .btn-entrar {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000;}
        .btn-verde {background:linear-gradient(90deg,#10b981,#22c55e); color:#000;}
        .btn-rojo {background:#ef4444; color:white;}
        .btn-naranja {background:#f59e0b; color:#000;}
        .btn-gris {background:#475569; color:white; margin-top:10px; display:none;}
        .error {color:#ef4444; text-align:center; margin-top:15px; display:none;}
        .enlace {display:block; text-align:center; color:#22d3ee; margin-top:20px; text-decoration:none;}
        .panel {display:none; max-width:800px; margin:0 auto;}
        .aviso {background:#1e3a2f; border:1px solid #10b981; padding:15px; border-radius:10px; margin-bottom:20px; text-align:center; color:#86efac;}
        .caja-form {background:#1e293b; padding:25px; border-radius:16px; margin-bottom:25px;}
        .tenis {background:#1e293b; padding:18px; border-radius:12px; margin-bottom:12px;}
        .fila-botones {display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
        .fila-botones button {flex:1; min-width:100px; padding:10px; font-size:14px;}
        .foto-vista {max-width:120px; border-radius:8px; margin:10px 0; display:none;}
        .mensaje {text-align:center; margin:15px 0; padding:12px; border-radius:8px; display:none; font-weight:bold;}
        .msg-bien {background:#1e3a2f; color:#86efac;}
        .msg-mal {background:#3b1f1f; color:#fca5a5;}
        .msg-carga {background:#2a2f3f; color:#fcd34d;}
        .cerrar {background:#334155; color:white; margin-top:30px;}
        label {color:#94a3b8; font-size:14px; display:block; margin-top:12px; margin-bottom:4px;}
    </style>
</head>
<body>

<div id="pant-login" class="login">
    <h2>🔐 INICIAR SESIÓN</h2>
    <input type="text" id="usuario" placeholder="Tu usuario">
    <input type="password" id="clave" placeholder="Tu contraseña">
    <button id="boton-ingresar" class="btn-entrar">ENTRAR</button>
    <p id="aviso-mal" class="error">Usuario o contraseña incorrectos</p>
    <a href="index.html" class="enlace">← Volver a la tienda</a>
</div>

<div id="pant-panel" class="panel">
    <h2>⚙️ PANEL DE ADMINISTRACIÓN</h2>
    <div class="aviso" id="barra-aviso">✅ Cargando tus tenis...</div>
    <div id="caja-msg" class="mensaje"></div>

    <div class="caja-form">
        <h3 id="tit-form">➕ AGREGAR NUEVO TENIS</h3>
        <label>Nombre / Modelo</label>
        <input type="text" id="f-nombre" placeholder="Ej: Predator Negro-Blanco">
        <label>Precio (Bolivianos)</label>
        <input type="number" id="f-precio" placeholder="Ej: 150">
        <label>Talla</label>
        <input type="number" id="f-talla" placeholder="Ej: 38">
        <label>Foto</label>
        <input type="file" id="f-foto" accept="image/*" onchange="cargarFoto(event)">
        <img id="vista-foto" class="foto-vista" alt="Vista previa">
        <button id="boton-guardar" class="btn-verde" onclick="guardar()">💾 GUARDAR Y PUBLICAR</button>
        <button id="boton-cancelar" class="btn-gris" onclick="cancelar()">❌ CANCELAR</button>
    </div>

    <h3 style="color:#22d3ee;">📋 MIS TENIS — TODOS APARECEN AQUÍ</h3>
    <div id="lista"></div>

    <button class="cerrar" onclick="salir()">Cerrar sesión</button>
    <a href="index.html" class="enlace">← Ir a la tienda</a>
</div>

<script src="datos.js"></script>
<script>
// ==============================================
// 🔑 CONFIGURACIÓN — NO TOCAR
// ==============================================
const ACCESO = USUARIOS;
const CONFIG = {
  REPO: "mamanicahuanajesus78/tienda-tenis",
  ARCHIVO: "datos.js",
  RAMA: "main"
};

let tenis = [...DATOS_INICIALES]; // ✅ CARGA TODOS TUS TENIS AUTOMÁTICO
let modoEditar = null;
let fotoGuardada = null;
let tokenGitHub = null;

// ==============================================
// 🔓 INICIO DE SESIÓN
// ==============================================
document.getElementById('boton-ingresar').addEventListener('click', verificarAcceso);

function verificarAcceso() {
    const usu = document.getElementById('usuario').value.trim();
    const cla = document.getElementById('clave').value.trim();
    
    if (ACCESO[usu] && ACCESO[usu] === cla) {
        document.getElementById('pant-login').style.display = 'none';
        document.getElementById('pant-panel').style.display = 'block';
        
        // Buscar token de GitHub
        tokenGitHub = buscarToken();
        if (tokenGitHub) {
            document.getElementById('barra-aviso').textContent = '✅ Conectado — se publica automático en 1 minuto';
        } else {
            document.getElementById('barra-aviso').textContent = '⚠️ Funciona local — sube a GitHub manualmente';
        }
        
        mostrarLista(); // ✅ MUESTRA TODOS TUS TENIS
    } else {
        document.getElementById('aviso-mal').style.display = 'block';
        setTimeout(() => document.getElementById('aviso-mal').style.display = 'none', 3000);
    }
}

// ==============================================
// 🔑 BUSCAR TOKEN DE GITHUB
// ==============================================
function buscarToken() {
    if (typeof window.GITHUB_TOKEN !== 'undefined') return window.GITHUB_TOKEN;
    if (typeof import.meta !== 'undefined' && import.meta.env?.VITE_GITHUB_TOKEN)
        return import.meta.env.VITE_GITHUB_TOKEN;
    return null;
}

// ==============================================
// 📷 CARGAR FOTO
// ==============================================
function cargarFoto(e) {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = function(datos) {
        fotoGuardada = datos.target.result;
        document.getElementById('vista-foto').src = fotoGuardada;
        document.getElementById('vista-foto').style.display = 'block';
    };
    lector.readAsDataURL(archivo);
}

// ==============================================
// 💾 GUARDAR — AGREGAR O EDITAR
// ==============================================
async function guardar() {
    const nombre = document.getElementById('f-nombre').value.trim();
    const precio = parseInt(document.getElementById('f-precio').value);
    const talla = parseInt(document.getElementById('f-talla').value);
    
    if (!nombre || !precio || !talla) {
        mostrarMensaje('mal', '⚠️ Llena nombre, precio y talla');
        return;
    }
    
    const imagen = fotoGuardada || (modoEditar !== null ? tenis[modoEditar].imagen : null);
    if (!imagen) {
        mostrarMensaje('mal', '⚠️ Elige una foto');
        return;
    }

    if (modoEditar !== null) {
        // ✏️ EDITAR
        tenis[modoEditar] = {...tenis[modoEditar], nombre, precio, tallaUnica: talla, imagen};
        modoEditar = null;
        document.getElementById('tit-form').textContent = '➕ AGREGAR NUEVO TENIS';
        document.getElementById('boton-cancelar').style.display = 'none';
    } else {
        // ➕ AGREGAR NUEVO
        tenis.push({id: Date.now(), nombre, precio, tallaUnica: talla, imagen, disponible: true});
    }

    await publicarGitHub();
    limpiarFormulario();
    mostrarLista();
}

// ==============================================
// ✅ CAMBIAR ESTADO: VENDIDO / DISPONIBLE
// ==============================================
async function cambiarEstado(numero) {
    tenis[numero].disponible = !tenis[numero].disponible;
    mostrarLista();
    await publicarGitHub();
}

// ==============================================
// ✏️ EDITAR TENIS
// ==============================================
function editar(numero) {
    const t = tenis[numero];
    document.getElementById('f-nombre').value = t.nombre;
    document.getElementById('f-precio').value = t.precio;
    document.getElementById('f-talla').value = t.tallaUnica;
    
    if (t.imagen && t.imagen.startsWith('data:')) {
        fotoGuardada = t.imagen;
        document.getElementById('vista-foto').src = t.imagen;
        document.getElementById('vista-foto').style.display = 'block';
    }
    
    modoEditar = numero;
    document.getElementById('tit-form').textContent = '✏️ EDITANDO TENIS';
    document.getElementById('boton-cancelar').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
}

function cancelar() {
    modoEditar = null;
    limpiarFormulario();
    document.getElementById('tit-form').textContent = '➕ AGREGAR NUEVO TENIS';
    document.getElementById('boton-cancelar').style.display = 'none';
}

// ==============================================
// 🗑️ BORRAR TENIS
// ==============================================
async function borrar(numero) {
    if (!confirm('¿Seguro que quieres borrar este tenis?')) return;
    tenis.splice(numero, 1);
    mostrarLista();
    await publicarGitHub();
}

// ==============================================
// 📋 MOSTRAR LISTA COMPLETA
// ==============================================
function mostrarLista() {
    const caja = document.getElementById('lista');
    caja.innerHTML = '';
    
    tenis.forEach((t, i) => {
        const estado = t.disponible 
            ? '<span style="color:#86efac;">✅ DISPONIBLE</span>' 
            : '<span style="color:#fca5a5;">❌ VENDIDO</span>';
        
        caja.innerHTML += `
        <div class="tenis">
            <h4 style="margin-bottom:6px; font-size:16px;">${t.nombre}</h4>
            <p style="color:#94a3b8; margin:4px 0;">Talla: ${t.tallaUnica} | Precio: ${t.precio} Bs</p>
            <p style="margin:4px 0;">${estado}</p>
            <div class="fila-botones">
                <button style="background:${t.disponible?'#ef4444':'#10b981'}; color:white;" 
                    onclick="cambiarEstado(${i})">
                    ${t.disponible?'Marcar VENDIDO':'Marcar DISPONIBLE'}
                </button>
                <button class="btn-naranja" onclick="editar(${i})">✏️ EDITAR</button>
                <button class="btn-rojo" onclick="borrar(${i})">🗑️ BORRAR</button>
            </div>
        </div>`;
    });
}

// ==============================================
// 🚀 PUBLICAR A GITHUB — TODO EL MUNDO LO VE
// ==============================================
async function publicarGitHub() {
    if (!tokenGitHub) {
        mostrarMensaje('mal', '⚠️ Sin conexión automática — sube datos.js a GitHub manualmente');
        return false;
    }

    mostrarMensaje('carga', '⏳ Subiendo a GitHub...');

    // Construir archivo completo
    const contenido = `// ACTUALIZADO: ${new Date().toLocaleString()}
const TU_WHATSAPP = "${TU_WHATSAPP}";
const USUARIOS = ${JSON.stringify(USUARIOS, null, 4)};
const DATOS_PAGO = ${JSON.stringify(DATOS_PAGO, null, 4)};
const DATOS_INICIALES = ${JSON.stringify(tenis, null, 4)};`;

    try {
        // 1. Leer versión actual
        const respArch = await fetch(
            `https://api.github.com/repos/${CONFIG.REPO}/contents/${CONFIG.ARCHIVO}`,
            {headers: {Authorization: `token ${tokenGitHub}`, "User-Agent": "Tienda-Tenis"}}
        );
        if (!respArch.ok) throw new Error('No se pudo leer GitHub');
        const datosArch = await respArch.json();

        // 2. Subir versión nueva
        const respSubida = await fetch(
            `https://api.github.com/repos/${CONFIG.REPO}/contents/${CONFIG.ARCHIVO}`,
            {
                method: "PUT",
                headers: {
                    Authorization: `token ${tokenGitHub}`,
                    "Content-Type": "application/json",
                    "User-Agent": "Tienda-Tenis"
                },
                body: JSON.stringify({
                    message: `Actualización — ${new Date().toLocaleString()}`,
                    content: btoa(unescape(encodeURIComponent(contenido))),
                    sha: datosArch.sha,
                    branch: CONFIG.RAMA
                })
            }
        );

        if (!respSubida.ok) throw new Error('Error al subir');
        
        mostrarMensaje('bien', '✅ ¡PUBLICADO! Espera 1 minuto y recarga la tienda');
        return true;

    } catch (err) {
        mostrarMensaje('mal', '❌ ' + err.message + ' — sube datos.js a GitHub manualmente');
        return false;
    }
}

// ==============================================
// 🔧 FUNCIONES AUXILIARES
// ==============================================
function limpiarFormulario() {
    document.getElementById('f-nombre').value = '';
    document.getElementById('f-precio').value = '';
    document.getElementById('f-talla').value = '';
    document.getElementById('f-foto').value = '';
    document.getElementById('vista-foto').style.display = 'none';
    fotoGuardada = null;
}

function mostrarMensaje(tipo, texto) {
    const m = document.getElementById('caja-msg');
    m.className = 'mensaje msg-' + tipo;
    m.textContent = texto;
    m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 6000);
}

function salir() {
    document.getElementById('pant-panel').style.display = 'none';
    document.getElementById('pant-login').style.display = 'block';
    document.getElementById('usuario').value = '';
    document.getElementById('clave').value = '';
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Tienda de Tenis — Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {background:#0f172a; color:white; padding:20px;}
        .login-caja {max-width:420px; margin:60px auto; padding:35px; background:#1e293b; border-radius:16px; border:2px solid #22d3ee;}
        h2 {text-align:center; color:#22d3ee; margin:0 0 25px 0;}
        input {width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #22d3ee50; background:#0f172a; color:white; font-size:16px;}
        button {width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:8px;}
        .btn-entrar {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000;}
        .btn-guardar {background:linear-gradient(90deg,#10b981,#22c55e); color:#000;}
        .btn-borrar {background:#ef4444; color:white;}
        .btn-editar {background:#f59e0b; color:#000;}
        .btn-cancelar {background:#475569; color:white; margin-top:10px; display:none;}
        .error-texto {color:#ef4444; text-align:center; margin-top:15px; display:none;}
        .panel {display:none; max-width:800px; margin:0 auto;}
        .aviso {background:#1e3a2f; border:1px solid #10b981; padding:15px; border-radius:10px; margin-bottom:20px; text-align:center; color:#86efac;}
        .form-caja {background:#1e293b; padding:25px; border-radius:16px; margin-bottom:25px;}
        .tenis-item {background:#1e293b; padding:18px; border-radius:12px; margin-bottom:12px;}
        .botones-accion {display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
        .botones-accion button {flex:1; min-width:100px; padding:10px; font-size:14px;}
        .foto-prevista {max-width:120px; border-radius:8px; margin:10px 0; display:none;}
        .mensaje {text-align:center; margin:15px 0; padding:12px; border-radius:8px; display:none; font-weight:bold;}
        .mensaje-exito {background:#1e3a2f; color:#86efac;}
        .mensaje-error {background:#3b1f1f; color:#fca5a5;}
        .mensaje-cargando {background:#2a2f3f; color:#fcd34d;}
        .enlace-volver {display:block; text-align:center; color:#22d3ee; margin-top:20px; text-decoration:none;}
        .boton-cerrar {background:#334155; color:white; margin-top:30px;}
    </style>
</head>
<body>

<div id="pantalla-login" class="login-caja">
    <h2>🔐 INICIAR SESIÓN</h2>
    <input type="text" id="usuario" placeholder="Tu usuario">
    <input type="password" id="clave" placeholder="Tu contraseña">
    <button class="btn-entrar" onclick="verificar()">ENTRAR</button>
    <p id="aviso-error" class="error-texto">Usuario o contraseña incorrectos</p>
    <a href="index.html" class="enlace-volver">← Volver a la tienda</a>
</div>

<div id="pantalla-panel" class="panel">
    <h2>⚙️ PANEL DE ADMINISTRACIÓN</h2>
    <div class="aviso">✅ Se publica SOLO — espera 1 minuto y recarga la tienda</div>
    <div id="caja-mensaje" class="mensaje"></div>

    <div class="form-caja">
        <h3 id="titulo-form">➕ AGREGAR NUEVO TENIS</h3>
        <input type="text" id="campo-nombre" placeholder="Nombre del modelo">
        <input type="number" id="campo-precio" placeholder="Precio en Bs">
        <input type="number" id="campo-talla" placeholder="Talla">
        <input type="file" id="campo-foto" accept="image/*" onchange="verFoto(event)">
        <img id="vista-foto" class="foto-prevista">
        <button class="btn-guardar" onclick="guardar()">💾 GUARDAR Y PUBLICAR</button>
        <button class="btn-cancelar" id="btn-cancelar" onclick="cancelar()">❌ CANCELAR</button>
    </div>

    <h3 style="color:#22d3ee;">📋 MIS TENIS</h3>
    <div id="lista"></div>

    <button class="boton-cerrar" onclick="cerrar()">Cerrar sesión</button>
    <a href="index.html" class="enlace-volver">← Ir a la tienda</a>
</div>

<script src="datos.js"></script>
<script>
// ==============================================
// TUS DATOS
// ==============================================
const USUARIOS_PERMITIDOS = {
  "jesus": "mamani",
  "yhubanneth": "71931423"
};

// CONFIGURACIÓN DE GITHUB — TU REPOSITORIO
const CONFIG = {
  REPO: "mamanicahuanajesus78/tienda-tenis",
  ARCHIVO_DATOS: "datos.js",
  RAMA: "main"
};

let listaTenis = [...DATOS_INICIALES];
let indiceEdicion = null;
let fotoBase64 = null;

// ==============================================
// INICIO DE SESIÓN
// ==============================================
function verificar() {
    const u = document.getElementById('usuario').value.trim();
    const c = document.getElementById('clave').value.trim();
    
    if (USUARIOS_PERMITIDOS[u] && USUARIOS_PERMITIDOS[u] === c) {
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('pantalla-panel').style.display = 'block';
        mostrarLista();
    } else {
        document.getElementById('aviso-error').style.display = 'block';
        setTimeout(() => document.getElementById('aviso-error').style.display = 'none', 3000);
    }
}

// ==============================================
// FOTO
// ==============================================
function verFoto(e) {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
        fotoBase64 = ev.target.result;
        document.getElementById('vista-foto').src = fotoBase64;
        document.getElementById('vista-foto').style.display = 'block';
    };
    r.readAsDataURL(f);
}

// ==============================================
// PUBLICAR A GITHUB — LO MÁS IMPORTANTE
// ==============================================
async function publicar() {
    const token = obtenerToken();
    if (!token) {
        mostrarMensaje('error', '❌ Falta el GITHUB_TOKEN en Vercel');
        return false;
    }

    // Construimos el archivo completo
    const contenido = `// ACTUALIZADO: ${new Date().toLocaleString()}
const TU_WHATSAPP = "${TU_WHATSAPP}";
const USUARIOS = ${JSON.stringify(USUARIOS_PERMITIDOS, null, 4)};
const DATOS_PAGO = ${JSON.stringify(DATOS_PAGO, null, 4)};
const DATOS_INICIALES = ${JSON.stringify(listaTenis, null, 4)};`;

    mostrarMensaje('cargando', '⏳ Subiendo a GitHub...');

    try {
        // 1. Leemos la versión actual para saber el SHA
        const respArchivo = await fetch(
            `https://api.github.com/repos/${CONFIG.REPO}/contents/${CONFIG.ARCHIVO_DATOS}`,
            { headers: { Authorization: `token ${token}`, "User-Agent": "Tienda-Tenis" } }
        );
        
        if (!respArchivo.ok) throw new Error('No se pudo leer de GitHub');
        const datosArchivo = await respArchivo.json();

        // 2. Subimos la versión nueva
        const respSubida = await fetch(
            `https://api.github.com/repos/${CONFIG.REPO}/contents/${CONFIG.ARCHIVO_DATOS}`,
            {
                method: "PUT",
                headers: {
                    Authorization: `token ${token}`,
                    "Content-Type": "application/json",
                    "User-Agent": "Tienda-Tenis"
                },
                body: JSON.stringify({
                    message: `Actualización: ${new Date().toLocaleString()}`,
                    content: btoa(unescape(encodeURIComponent(contenido))),
                    sha: datosArchivo.sha,
                    branch: CONFIG.RAMA
                })
            }
        );

        if (!respSubida.ok) {
            const error = await respSubida.json();
            throw new Error(error.message || 'Error al subir');
        }

        mostrarMensaje('exito', '✅ ¡PUBLICADO! Recarga la tienda en 1 minuto');
        return true;

    } catch (err) {
        mostrarMensaje('error', '❌ ' + err.message);
        return false;
    }
}

function obtenerToken() {
    // Busca el token desde Vercel
    if (typeof window.GITHUB_TOKEN !== 'undefined') return window.GITHUB_TOKEN;
    if (typeof import.meta !== 'undefined' && import.meta.env?.VITE_GITHUB_TOKEN) 
        return import.meta.env.VITE_GITHUB_TOKEN;
    return null;
}

// ==============================================
// GUARDAR TENIS
// ==============================================
async function guardar() {
    const nombre = document.getElementById('campo-nombre').value.trim();
    const precio = parseInt(document.getElementById('campo-precio').value);
    const talla = parseInt(document.getElementById('campo-talla').value);
    
    if (!nombre || !precio || !talla) {
        mostrarMensaje('error', '⚠️ Llena todos los datos');
        return;
    }

    const imagen = fotoBase64 || (indiceEdicion !== null ? listaTenis[indiceEdicion].imagen : null);
    if (!imagen) {
        mostrarMensaje('error', '⚠️ Elige una foto');
        return;
    }

    if (indiceEdicion !== null) {
        listaTenis[indiceEdicion] = { 
            ...listaTenis[indiceEdicion], 
            nombre, precio, tallaUnica: talla, imagen 
        };
        indiceEdicion = null;
        document.getElementById('titulo-form').textContent = '➕ AGREGAR NUEVO TENIS';
        document.getElementById('btn-cancelar').style.display = 'none';
    } else {
        listaTenis.push({ id: Date.now(), nombre, precio, tallaUnica: talla, imagen, disponible: true });
    }

    const ok = await publicar();
    if (ok) {
        limpiar();
        mostrarLista();
    }
}

// ==============================================
// FUNCIONES AUXILIARES
// ==============================================
async function cambiarEstado(i) {
    listaTenis[i].disponible = !listaTenis[i].disponible;
    mostrarLista();
    await publicar();
}

function editar(i) {
    const t = listaTenis[i];
    document.getElementById('campo-nombre').value = t.nombre;
    document.getElementById('campo-precio').value = t.precio;
    document.getElementById('campo-talla').value = t.tallaUnica;
    fotoBase64 = t.imagen;
    if (t.imagen && t.imagen.startsWith('data:')) {
        document.getElementById('vista-foto').src = t.imagen;
        document.getElementById('vista-foto').style.display = 'block';
    }
    indiceEdicion = i;
    document.getElementById('titulo-form').textContent = '✏️ EDITANDO';
    document.getElementById('btn-cancelar').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
}

function cancelar() {
    indiceEdicion = null;
    limpiar();
    document.getElementById('titulo-form').textContent = '➕ AGREGAR NUEVO TENIS';
    document.getElementById('btn-cancelar').style.display = 'none';
}

async function borrar(i) {
    if (!confirm('¿Borrar este tenis?')) return;
    listaTenis.splice(i, 1);
    mostrarLista();
    await publicar();
}

function limpiar() {
    document.getElementById('campo-nombre').value = '';
    document.getElementById('campo-precio').value = '';
    document.getElementById('campo-talla').value = '';
    document.getElementById('campo-foto').value = '';
    document.getElementById('vista-foto').style.display = 'none';
    fotoBase64 = null;
}

function mostrarLista() {
    const caja = document.getElementById('lista');
    caja.innerHTML = '';
    listaTenis.forEach((t, i) => {
        caja.innerHTML += `
        <div class="tenis-item">
            <h4 style="margin:0 0 6px 0;">${t.nombre}</h4>
            <p style="color:#94a3b8; margin:4px 0;">Talla: ${t.tallaUnica} | Precio: ${t.precio} Bs</p>
            <p style="color:${t.disponible?'#86efac':'#fca5a5'}; font-weight:bold;">
                ${t.disponible?'✅ DISPONIBLE':'❌ VENDIDO'}
            </p>
            <div class="botones-accion">
                <button style="background:${t.disponible?'#ef4444':'#10b981'}; color:white;" 
                    onclick="cambiarEstado(${i})">
                    ${t.disponible?'Marcar VENDIDO':'Marcar DISPONIBLE'}
                </button>
                <button class="btn-editar" onclick="editar(${i})">✏️ EDITAR</button>
                <button class="btn-borrar" onclick="borrar(${i})">🗑️ BORRAR</button>
            </div>
        </div>`;
    });
}

function mostrarMensaje(tipo, texto) {
    const m = document.getElementById('caja-mensaje');
    m.className = `mensaje mensaje-${tipo}`;
    m.textContent = texto;
    m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 5000);
}

function cerrar() {
    document.getElementById('pantalla-panel').style.display = 'none';
    document.getElementById('pantalla-login').style.display = 'block';
    document.getElementById('usuario').value = '';
    document.getElementById('clave').value = '';
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Panel de Administración — Automático</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui;}
        body {background:#0f172a; color:white; padding:20px;}
        .caja-login {max-width:420px; margin:60px auto; padding:35px; background:#1e293b; border-radius:16px; border:2px solid #22d3ee;}
        h2 {text-align:center; color:#22d3ee; margin-bottom:25px;}
        input, select {width:100%; padding:14px; margin:8px 0; border-radius:10px; border:2px solid #22d3ee50; background:#0f172a; color:white; font-size:16px;}
        button {padding:14px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:8px;}
        .btn-entrar {width:100%; background:linear-gradient(90deg,#22d3ee,#10b981); color:#000; font-size:16px;}
        .btn-verde {background:linear-gradient(90deg,#10b981,#22c55e); color:#000;}
        .btn-rojo {background:#ef4444; color:white;}
        .btn-naranja {background:#f59e0b; color:#000;}
        .btn-gris {background:#475569; color:white; display:none;}
        .error {color:#ef4444; text-align:center; margin-top:15px; display:none;}
        .panel {display:none; max-width:800px; margin:0 auto;}
        .aviso {background:#1e3a2f; border:1px solid #10b981; padding:15px; border-radius:10px; margin-bottom:20px; text-align:center; color:#86efac;}
        .caja-form {background:#1e293b; padding:25px; border-radius:16px; margin-bottom:25px;}
        .tenis {background:#1e293b; padding:18px; border-radius:12px; margin-bottom:12px;}
        .foto-tenis {max-width:120px; border-radius:8px; margin:8px 0;}
        .fila-botones {display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
        .fila-botones button {flex:1; min-width:100px; padding:10px; font-size:14px;}
        .foto-vista {max-width:120px; border-radius:8px; margin:10px 0; display:none;}
        .mensaje {text-align:center; margin:15px 0; padding:12px; border-radius:8px; display:none; font-weight:bold;}
        .msg-bien {background:#1e3a2f; color:#86efac;}
        .msg-mal {background:#3b1f1f; color:#fca5a5;}
        .cerrar {background:#334155; color:white; width:100%; margin-top:30px;}
        label {color:#94a3b8; font-size:14px; display:block; margin-top:12px; margin-bottom:4px;}
        .enlace {display:block; text-align:center; color:#22d3ee; margin-top:20px; text-decoration:none;}
    </style>
</head>
<body>

<div id="login" class="caja-login">
    <h2>🔐 INICIAR SESIÓN</h2>
    <input type="text" id="usuario" placeholder="Tu usuario">
    <input type="password" id="clave" placeholder="Tu contraseña">
    <button id="botonEntrar" class="btn-entrar">ENTRAR</button>
    <p id="mensajeError" class="error">Usuario o contraseña incorrectos</p>
    <a href="index.html" class="enlace">← Volver a la tienda</a>
</div>

<div id="panel" class="panel">
    <h2>⚙️ PANEL DE ADMINISTRACIÓN — ¡TODO AUTOMÁTICO! ⚡</h2>
    <div class="aviso">✅ Lo que guardes aparece al instante en la tienda — NO necesitas subir nada a GitHub</div>
    <div id="cajaMensaje" class="mensaje"></div>

    <div class="caja-form">
        <h3 id="tituloForm">➕ AGREGAR NUEVO TENIS</h3>
        <label>Nombre / Modelo</label>
        <input type="text" id="fNombre" placeholder="Ej: Predator Negro-Blanco">
        <label>Precio (Bolivianos)</label>
        <input type="number" id="fPrecio" placeholder="Ej: 150">
        <label>Talla</label>
        <select id="fTalla">
            <option value="20">Talla 20</option>
            <option value="38">Talla 38</option>
            <option value="39">Talla 39</option>
            <option value="40">Talla 40</option>
            <option value="41">Talla 41</option>
        </select>
        <label>Foto</label>
        <input type="file" id="fFoto" accept="image/*" onchange="cargarFoto(event)">
        <img id="vistaFoto" class="foto-vista" alt="Vista previa">
        <button id="botonGuardar" class="btn-verde" onclick="guardar()">💾 GUARDAR — APARECE AL INSTANTE ⚡</button>
        <button id="botonCancelar" class="btn-gris" onclick="cancelar()">❌ CANCELAR</button>
    </div>

    <h3 style="color:#22d3ee;">📋 MIS TENIS — En tiempo real</h3>
    <div id="lista"></div>

    <button class="cerrar" onclick="salir()">Cerrar sesión</button>
    <a href="index.html" class="enlace">← Ir a la tienda</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDg4IAfAWB_WVnHBFTkmCJC5mMTsUosprw",
    authDomain: "tienda-tenis-ba844.firebaseapp.com",
    projectId: "tienda-tenis-ba844",
    storageBucket: "tienda-tenis-ba844.firebasestorage.app",
    messagingSenderId: "802544997333",
    appId: "1:802544997333:web:2136a4064e9a0afc6da35c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔑 TUS USUARIOS Y CONTRASEÑAS
const ACCESO = {
  "jesus": "mamani",
  "yhubanneth": "71931423"
};

let modoEditar = null;
let fotoGuardada = null;
let tenisCargados = [];

// Inicio de sesión
document.getElementById('botonEntrar').addEventListener('click', function() {
    const usu = document.getElementById('usuario').value.trim();
    const cla = document.getElementById('clave').value.trim();
    
    if (ACCESO[usu] && ACCESO[usu] === cla) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        escucharCambios();
    } else {
        document.getElementById('mensajeError').style.display = 'block';
        setTimeout(() => document.getElementById('mensajeError').style.display = 'none', 3000);
    }
});

// Escuchar cambios en tiempo real
function escucharCambios() {
    db.collection("tenis").orderBy("nombre").onSnapshot(snapshot => {
        tenisCargados = [];
        snapshot.forEach(doc => {
            tenisCargados.push({id:doc.id, ...doc.data()});
        });
        mostrarLista();
    });
}

// Cargar foto
function cargarFoto(e) {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = function(datos) {
        fotoGuardada = datos.target.result;
        document.getElementById('vistaFoto').src = fotoGuardada;
        document.getElementById('vistaFoto').style.display = 'block';
    };
    lector.readAsDataURL(archivo);
}

// Guardar en Firebase
async function guardar() {
    const nombre = document.getElementById('fNombre').value.trim();
    const precio = parseInt(document.getElementById('fPrecio').value);
    const talla = document.getElementById('fTalla').value;
    
    if (!nombre || !precio || !talla) {
        mostrarMensaje('mal', '⚠️ Llena todos los campos');
        return;
    }
    
    const imagen = fotoGuardada || (modoEditar !== null ? tenisCargados[modoEditar].imagen : null);
    if (!imagen) {
        mostrarMensaje('mal', '⚠️ Elige una foto');
        return;
    }

    try {
        if (modoEditar !== null) {
            const id = tenisCargados[modoEditar].id;
            await db.collection("tenis").doc(id).update({nombre, precio, talla, imagen});
            mostrarMensaje('bien', '✅ ¡Actualizado! Se ve al instante en la tienda');
        } else {
            await db.collection("tenis").add({nombre, precio, talla, imagen, disponible: true});
            mostrarMensaje('bien', '✅ ¡Agregado! Aparece solo en la tienda ⚡');
        }
        limpiarFormulario();
        cancelar();
    } catch (error) {
        mostrarMensaje('mal', '❌ Error: ' + error.message);
    }
}

// Cambiar estado Vendido/Disponible
async function cambiarEstado(i) {
    const t = tenisCargados[i];
    await db.collection("tenis").doc(t.id).update({disponible: !t.disponible});
    mostrarMensaje('bien', t.disponible ? '✅ Marcado como DISPONIBLE' : '❌ Marcado como VENDIDO');
}

// Editar tenis
function editar(i) {
    const t = tenisCargados[i];
    document.getElementById('fNombre').value = t.nombre;
    document.getElementById('fPrecio').value = t.precio;
    document.getElementById('fTalla').value = t.talla;
    if (t.imagen) {
        fotoGuardada = t.imagen;
        document.getElementById('vistaFoto').src = t.imagen;
        document.getElementById('vistaFoto').style.display = 'block';
    }
    modoEditar = i;
    document.getElementById('tituloForm').textContent = '✏️ EDITANDO TENIS';
    document.getElementById('botonCancelar').style.display = 'block';
    window.scrollTo({top:0});
}

function cancelar() {
    modoEditar = null;
    fotoGuardada = null;
    limpiarFormulario();
    document.getElementById('tituloForm').textContent = '➕ AGREGAR NUEVO TENIS';
    document.getElementById('botonCancelar').style.display = 'none';
}

// Borrar tenis
async function borrar(i) {
    if (!confirm('¿Borrar este tenis? Ya no aparecerá en la tienda')) return;
    await db.collection("tenis").doc(tenisCargados[i].id).delete();
    mostrarMensaje('bien', '✅ Borrado de la tienda');
}

// Mostrar lista
function mostrarLista() {
    const caja = document.getElementById('lista');
    caja.innerHTML = '';
    
    if (tenisCargados.length === 0) {
        caja.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:20px;">Aún no hay tenis. Agrega el primero arriba 👆</p>';
        return;
    }
    
    tenisCargados.forEach((t, i) => {
        const estado = t.disponible 
            ? '<span style="color:#86efac;">✅ DISPONIBLE</span>' 
            : '<span style="color:#fca5a5;">❌ VENDIDO</span>';
        
        caja.innerHTML += `
        <div class="tenis">
            <img src="${t.imagen}" class="foto-tenis" alt="${t.nombre}">
            <h4 style="margin-bottom:6px;">${t.nombre}</h4>
            <p style="color:#94a3b8; margin:4px 0;">Talla: ${t.talla} | Precio: ${t.precio} Bs</p>
            <p style="margin:4px 0;">${estado}</p>
            <div class="fila-botones">
                <button style="background:${t.disponible?'#ef4444':'#10b981'}; color:white;" onclick="cambiarEstado(${i})">
                    ${t.disponible?'Marcar VENDIDO':'Marcar DISPONIBLE'}
                </button>
                <button class="btn-naranja" onclick="editar(${i})">✏️ EDITAR</button>
                <button class="btn-rojo" onclick="borrar(${i})">🗑️ BORRAR</button>
            </div>
        </div>`;
    });
}

function limpiarFormulario() {
    document.getElementById('fNombre').value = '';
    document.getElementById('fPrecio').value = '';
    document.getElementById('fTalla').value = '38';
    document.getElementById('fFoto').value = '';
    document.getElementById('vistaFoto').style.display = 'none';
}

function mostrarMensaje(tipo, texto) {
    const m = document.getElementById('cajaMensaje');
    m.className = 'mensaje msg-' + tipo;
    m.textContent = texto;
    m.style.display = 'block';
    setTimeout(() => m.style.display = 'none', 6000);
}

function salir() {
    document.getElementById('panel').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('usuario').value = '';
    document.getElementById('clave').value = '';
}
</script>

</body>
</html>

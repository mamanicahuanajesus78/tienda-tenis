<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            max-width: 420px;
            margin: 60px auto;
            padding: 35px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 2px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
        .login-box h2 {
            text-align: center;
            color: #00f0ff;
            margin-bottom: 25px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00f0ff, #00ff88);
            color: #000;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.4);
        }
        .error {
            color: #ff4466;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .admin-section {
            display: none;
        }
        .item-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        .toggle-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .disponible {
            background: linear-gradient(90deg, #00ff88, #00dd77);
            color: #000;
        }
        .vendido {
            background: linear-gradient(90deg, #ff4466, #dd3355);
            color: white;
        }
        .cerrar {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .volver {
            display: block;
            text-align: center;
            color: #00f0ff;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="contenedor">

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div id="pantalla-login" class="login-box">
        <h2>🔐 INICIAR SESIÓN</h2>
        <input type="text" id="usuario-input" placeholder="Escribe tu usuario">
        <input type="password" id="clave-input" placeholder="Escribe tu contraseña">
        <button onclick="verificarAcceso()">ENTRAR</button>
        <p id="mensaje-error" class="error">Usuario o contraseña incorrectos ❌</p>
        <a href="index.html" class="volver">← Volver a la tienda</a>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <div id="panel-admin" class="admin-section">
        <h2 style="text-align:center; color:#00ff88; margin:30px 0;">⚙️ PANEL DE ADMINISTRACIÓN</h2>
        <p style="text-align:center; color:#b0b0c0;">Marca como vendido o disponible los modelos</p>
        <div id="lista-items"></div>
        <button class="cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
        <a href="index.html" class="volver">← Volver a la tienda</a>
    </div>

</div>

<script src="datos.js"></script>
<script>
let productos = [];

// ==============================================
// VERIFICAR USUARIO
// ==============================================
function verificarAcceso() {
    const usuario = document.getElementById('usuario-input').value.trim();
    const clave = document.getElementById('clave-input').value.trim();
    
    // Comprobar si existe el usuario con su contraseña
    if (USUARIOS[usuario] && USUARIOS[usuario] === clave) {
        // Acceso correcto ✅
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('panel-admin').style.display = 'block';
        cargarLista();
    } else {
        // Acceso incorrecto ❌
        document.getElementById('mensaje-error').style.display = 'block';
        setTimeout(() => {
            document.getElementById('mensaje-error').style.display = 'none';
        }, 3000);
    }
}

// ==============================================
// CARGAR LISTA DE PRODUCTOS
// ==============================================
async function cargarLista() {
    try {
        const resp = await fetch('productos.json');
        productos = resp.ok ? await resp.json() : DATOS_INICIALES;
    } catch {
        productos = DATOS_INICIALES;
    }
    
    const lista = document.getElementById('lista-items');
    lista.innerHTML = '';
    
    productos.forEach((p, index) => {
        lista.innerHTML += `
        <div class="item-card">
            <h4 style="font-size:18px; margin-bottom:8px;">${p.nombre}</h4>
            <p style="color:#b0b0c0; margin:5px 0;">Talla: ${p.tallaUnica} | Precio: ${p.precio} Bs</p>
            <p style="color:${p.disponible ? '#00ff88' : '#ff4466'}; font-weight:bold;">
                ${p.disponible ? '✅ DISPONIBLE' : '❌ VENDIDO'}
            </p>
            <button class="toggle-btn ${p.disponible ? 'vendido' : 'disponible'}" 
                onclick="cambiarEstado(${index})">
                ${p.disponible ? 'Marcar VENDIDO' : 'Marcar DISPONIBLE'}
            </button>
        </div>`;
    });
}

// ==============================================
// CAMBIAR ESTADO DISPONIBLE/VENDIDO
// ==============================================
function cambiarEstado(indice) {
    productos[indice].disponible = !productos[indice].disponible;
    alert('✅ Estado cambiado correctamente!\n\nRecuerda: Para que se vea en la tienda, avísame cómo guardar.');
    cargarLista();
}

// ==============================================
// CERRAR SESIÓN
// ==============================================
function cerrarSesion() {
    document.getElementById('panel-admin').style.display = 'none';
    document.getElementById('pantalla-login').style.display = 'block';
    document.getElementById('usuario-input').value = '';
    document.getElementById('clave-input').value = '';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Tienda de Tenis — Modelos Únicos</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui;}
        body {background:#0f172a; color:white; padding:20px; min-height:100vh;}
        .contenedor {max-width:1200px; margin:0 auto; position:relative;}

        /* 👤 Ícono administrador */
        .icono-admin {
            position:absolute;
            top:5px;
            right:5px;
            font-size:1.7rem;
            background:#1e293b;
            padding:8px 11px;
            border-radius:50%;
            cursor:pointer;
            border:2px solid #22d3ee;
            transition:all 0.2s;
            z-index:10;
            text-decoration:none;
        }
        .icono-admin:hover {
            background:#22d3ee;
            color:#000;
        }

        header {text-align:center; padding:30px 45px 10px;}
        h1 {font-size:2rem; background:linear-gradient(90deg,#22d3ee,#10b981); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
        .subtitulo {color:#94a3b8; margin-top:10px; margin-bottom:20px;}

        /* 💳 Sección de pago */
        .pago {
            background:#1e293b;
            padding:20px;
            border-radius:16px;
            text-align:center;
            margin-bottom:25px;
        }
        .pago h3 {color:#22d3ee; margin-bottom:12px; font-size:1.1rem;}
        .pago p {margin:6px 0; font-size:0.95rem;}
        .qr-img {
            max-width:240px;
            width:75%;
            border-radius:12px;
            margin:12px auto;
            display:block;
            border:3px solid rgba(34,211,238,0.3);
            cursor:zoom-in;
        }
        .clic-qr {font-size:0.8rem; color:#94a3b8; margin-top:-5px;}

        /* FILTROS DINÁMICOS */
        .filtros {display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:25px;}
        .filtro {padding:10px 20px; border-radius:30px; border:none; background:#1e293b; color:white; cursor:pointer; transition:all 0.3s;}
        .filtro.activo {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000; font-weight:bold;}

        /* Tarjetas de tenis */
        .grid {display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:25px;}
        .tarjeta {background:#1e293b; border-radius:16px; overflow:hidden; border:2px solid transparent; transition:all 0.3s;}
        .tarjeta:hover {border-color:#22d3ee; transform:translateY(-5px);}
        .tarjeta.vendida {opacity:0.6; border-color:#ef4444;}
        .foto {width:100%; height:250px; object-fit:cover; background:#334155;}
        .info {padding:20px;}
        .nombre {font-size:1.2rem; font-weight:bold; margin-bottom:10px;}
        .talla {color:#94a3b8; margin-bottom:8px;}
        .precio {font-size:1.4rem; color:#10b981; font-weight:bold; margin-bottom:15px;}
        .vendido-texto {color:#ef4444; font-weight:bold; text-align:center; padding:10px;}
        .boton {width:100%; padding:12px; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; transition:all 0.3s;}
        .btn-comprar {background:linear-gradient(90deg,#22d3ee,#10b981); color:#000;}
        .btn-comprar:disabled {background:#475569; color:#94a3b8; cursor:not-allowed;}
        .cargando {text-align:center; padding:50px; color:#94a3b8;}

        /* QR grande */
        .modal-qr {display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:999; align-items:center; justify-content:center;}
        .modal-qr.activo {display:flex;}
        .modal-qr img {max-width:90%; max-height:80vh; border-radius:12px;}
        .cerrar-qr {position:absolute; top:20px; right:30px; color:white; font-size:2rem; cursor:pointer;}
    </style>
</head>
<body>

<div class="contenedor">
    <!-- 👤 Ícono administrador -->
    <a href="admin.html" class="icono-admin" title="Administrar">👤</a>

    <header>
        <h1>👟 TIENDA DE TENIS</h1>
        <p class="subtitulo">Modelos únicos — Entregas los sábados</p>
    </header>

    <!-- 💳 Formas de pago -->
    <div class="pago">
        <h3>💳 FORMAS DE PAGO</h3>
        <p><strong>Nombre:</strong> Jesus Mamani Cahuana</p>
        <p><strong>Yape:</strong> 63228616</p>
        <img src="tu-qr.jpg" alt="QR de pago" class="qr-img" onclick="abrirQr()">
        <p class="clic-qr">👆 Toca para agrandar el QR</p>
        <p style="margin-top:8px;">📦 Entrega: Sábados — Ceibo Paquetería</p>
    </div>

    <!-- Filtros dinámicos -->
    <div class="filtros" id="cajaFiltros"></div>

    <!-- Lista de tenis -->
    <div id="gridTenis" class="grid"></div>
</div>

<!-- QR grande modal -->
<div class="modal-qr" id="modalQr" onclick="if(event.target===this) cerrarQr()">
    <span class="cerrar-qr" onclick="cerrarQr()">&times;</span>
    <img src="tu-qr.jpg" alt="QR Agrandado">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDg4IAfAWB_WVnHBFTkmCJC5mMTsUosprw",
    authDomain: "tienda-tenis-ba844.firebaseapp.com",
    projectId: "tienda-tenis-ba844",
    storageBucket: "tienda-tenis-ba844.firebasestorage.app",
    messagingSenderId: "802544997333",
    appId: "1:802544997333:web:2136a4064e9a0afc6da35c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const TU_WHATSAPP = "59161159473";
let filtroActivo = "todos";
let listaTenis = [];

// Cargar tenis en tiempo real
db.collection("tenis").onSnapshot(snapshot => {
    listaTenis = [];
    snapshot.forEach(doc => listaTenis.push({id:doc.id, ...doc.data()}));
    actualizarFiltros();
    mostrarTenis();
});

// ✅ Filtros dinámicos: solo tallas que existen disponibles
function actualizarFiltros() {
    const caja = document.getElementById("cajaFiltros");
    
    const tallasDisponibles = [...new Set(
        listaTenis
            .filter(t => t.disponible !== false)
            .map(t => t.talla)
    )].sort((a, b) => Number(a) - Number(b));

    caja.innerHTML = `<button class="filtro ${filtroActivo==='todos'?'activo':''}" data-talla="todos">Todos</button>`;
    
    tallasDisponibles.forEach(talla => {
        caja.innerHTML += `<button class="filtro ${filtroActivo===talla?'activo':''}" data-talla="${talla}">Talla ${talla}</button>`;
    });

    // Asignar eventos a los botones nuevos
    document.querySelectorAll(".filtro").forEach(boton => {
        boton.addEventListener("click", () => {
            document.querySelectorAll(".filtro").forEach(b => b.classList.remove("activo"));
            boton.classList.add("activo");
            filtroActivo = boton.dataset.talla;
            mostrarTenis();
        });
    });
}

function mostrarTenis() {
    const caja = document.getElementById("gridTenis");
    caja.innerHTML = "";
    
    const filtrados = filtroActivo === "todos" 
        ? listaTenis 
        : listaTenis.filter(t => String(t.talla) === String(filtroActivo));
    
    if (filtrados.length === 0) {
        caja.innerHTML = '<p class="cargando">No hay tenis de esta talla disponible 😊</p>';
        return;
    }
    
    filtrados.forEach(t => {
        caja.innerHTML += `
        <div class="tarjeta ${t.disponible ? '' : 'vendida'}">
            <img src="${t.imagen}" alt="${t.nombre}" class="foto">
            <div class="info">
                <h3 class="nombre">${t.nombre}</h3>
                <p class="talla">👞 Talla: ${t.talla}</p>
                <p class="precio">${t.precio} Bs</p>
                ${t.disponible 
                    ? `<button class="boton btn-comprar" onclick="comprar('${t.id}','${t.nombre}','${t.talla}','${t.precio}')">💬 Preguntar por WhatsApp</button>` 
                    : `<p class="vendido-texto">❌ VENDIDO</p>`
                }
            </div>
        </div>`;
    });
}

function comprar(id, nombre, talla, precio) {
    const enlace = window.location.origin + window.location.pathname + '#tenis-' + id;
    const msg = encodeURIComponent(
        `Hola! 👟 Me interesa este modelo:\n\n📦 ${nombre}\n👞 Talla: ${talla}\n💰 Precio: ${precio} Bs\n\n🔗 Ver: ${enlace}\nQuedo atento para el pago y entrega. Gracias!`
    );
    window.open(`https://wa.me/${TU_WHATSAPP}?text=${msg}`);
}

function abrirQr() {
    document.getElementById('modalQr').classList.add('activo');
}
function cerrarQr() {
    document.getElementById('modalQr').classList.remove('activo');
}
</script>

</body>
</html>

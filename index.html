<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Tienda de Tenis — Modelos Únicos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contenedor-qr {
            position: relative;
            display: inline-block;
            margin: 15px 0;
        }
        .qr-img {
            max-width: 240px;
            width: 80%;
            border-radius: 12px;
            border: 3px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .lupa-btn {
            position: absolute;
            bottom: 8px;
            right: calc(10% + 8px);
            background: rgba(0,0,0,0.7);
            color: #22d3ee;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lupa-btn:hover {
            background: #22d3ee;
            color: #000;
        }
        .pago {text-align: center;}
        .dato {font-size: 16px; margin: 8px 0;}
        .numero-etiqueta {
            display: inline-block;
            background: #22d3ee;
            color: #000;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            margin-right: 8px;
        }
        .producto {
            scroll-margin-top: 80px;
            transition: box-shadow 0.5s ease, transform 0.5s ease;
        }
        .producto.destacado {
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.8);
            transform: scale(1.02);
            border-color: #22d3ee !important;
        }
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }
        .talla-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: #1e293b;
            color: white;
        }
        .talla-btn.activo {
            background: linear-gradient(90deg, #22d3ee, #10b981);
            color: #000;
        }
        /* QR GRANDE */
        .ventana-qr-grande {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
        }
        .qr-grande-imagen {
            max-width: 90%;
            max-height: 75vh;
            border-radius: 12px;
            border: 4px solid #22d3ee;
        }
        .btn-cerrar-qr {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="contenedor">
    <header>
        <h1>👟 TIENDA DE TENIS</h1>
        <p class="subtitulo">Modelos únicos — Elige y compra directo 🚀</p>
    </header>

    <div class="pago" id="seccion-pago">
        <h3>💳 FORMA DE PAGO</h3>
        <p class="dato"><strong>Nombre:</strong> <span id="nombre-dato"></span></p>
        <p class="dato"><strong id="banco-titulo"></strong>: <span id="banco-dato"></span></p>
        
        <div class="contenedor-qr">
            <img src="" alt="Código QR de Pago" class="qr-img" id="qr-imagen">
            <button class="lupa-btn" onclick="abrirQRgrande()">🔍</button>
        </div>
        
        <p style="margin-top:15px; font-size:15px; color:#aaa;">📱 Escanea el código QR → paga → manda comprobante por WhatsApp</p>
        <p style="margin-top:10px; color:#00ff88; font-weight:bold; font-size:15px;" id="entrega-dato"></p>
    </div>

    <div class="filtros" id="filtros-tallas">
        <!-- Los botones aparecen SOLOS aquí -->
    </div>

    <div class="grid" id="productos">
        <p style="text-align:center; color:#aaa; padding:40px; font-size:18px;">Cargando modelos...</p>
    </div>

    <footer>
        💬 Al comprar te escribo por WhatsApp y coordinamos la entrega 🚚
        <br><br>
        <a href="admin.html">🔐 Panel de Administración</a>
    </footer>
</div>

<!-- QR GRANDE -->
<div class="ventana-qr-grande" id="ventanaQR" onclick="cerrarQRgrande()">
    <img src="" alt="QR en grande" class="qr-grande-imagen" id="qr-imagen-grande">
    <button class="btn-cerrar-qr">✖ Cerrar</button>
</div>

<script src="datos.js"></script>
<script>
let productos = [...DATOS_INICIALES];
let filtroActivo = 'todos';

// Numerar tenis
productos.forEach((p, i) => p.numero = i + 1);

// ✅ OBTENER SOLO LAS TALLAS QUE EXISTEN
function obtenerTallasDisponibles() {
    const tallasUnicas = [...new Set(productos.map(p => p.tallaUnica))];
    return tallasUnicas.sort((a, b) => a - b); // Ordena de menor a mayor
}

// ✅ CREAR BOTONES DINÁMICAMENTE
function dibujarBotonesTallas() {
    const contenedor = document.getElementById('filtros-tallas');
    const tallas = obtenerTallasDisponibles();
    
    contenedor.innerHTML = `<button class="talla-btn ${filtroActivo==='todos'?'activo':''}" data-talla="todos">Todos</button>`;
    
    tallas.forEach(talla => {
        contenedor.innerHTML += `<button class="talla-btn ${filtroActivo===talla?'activo':''}" data-talla="${talla}">${talla}</button>`;
    });

    // Agregar eventos a los botones nuevos
    document.querySelectorAll('.talla-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            filtroActivo = btn.dataset.talla;
            dibujarBotonesTallas(); // Actualiza botones
            mostrarProductos(filtroActivo);
        });
    });
}

mostrarPago();
dibujarBotonesTallas();
mostrarProductos('todos');

// ✅ Ir directo al tenis desde el enlace
window.addEventListener('load', () => {
    setTimeout(() => {
        const hash = window.location.hash;
        if (!hash) return;
        const idBuscado = hash.replace('#tenis-', '');
        const elemento = document.querySelector(`[data-id="${idBuscado}"]`);
        if (elemento) {
            elemento.scrollIntoView({ behavior: 'smooth', block: 'center' });
            elemento.classList.add('destacado');
            setTimeout(() => elemento.classList.remove('destacado'), 4000);
        }
    }, 400);
});

function mostrarPago() {
    document.getElementById('nombre-dato').textContent = DATOS_PAGO.nombre;
    document.getElementById('banco-titulo').textContent = DATOS_PAGO.banco;
    document.getElementById('banco-dato').textContent = DATOS_PAGO.numeroCuenta;
    document.getElementById('qr-imagen').src = DATOS_PAGO.qrImagen;
    document.getElementById('qr-imagen-grande').src = DATOS_PAGO.qrImagen;
    document.getElementById('entrega-dato').textContent = DATOS_PAGO.entrega;
}

function abrirQRgrande() {
    document.getElementById('ventanaQR').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function cerrarQRgrande() {
    document.getElementById('ventanaQR').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function mostrarProductos(filtro = 'todos') {
    const grid = document.getElementById('productos');
    grid.innerHTML = '';
    
    productos.forEach(p => {
        if (filtro !== 'todos' && p.tallaUnica !== parseInt(filtro)) return;
        
        grid.innerHTML += `
        <div class="producto" data-id="${p.id}">
            <img src="${p.imagen}" class="prod-img" alt="${p.nombre}" loading="lazy">
            <div class="prod-info">
                <h4 class="prod-nombre">
                    <span class="numero-etiqueta">#${p.numero}</span>
                    ${p.nombre}
                </h4>
                <p class="prod-precio">${p.precio} Bs</p>
                <span class="prod-talla">👟 Talla ${p.tallaUnica}</span>
                <p class="${p.disponible ? 'disponible' : 'vendido'}">
                    ${p.disponible ? '✅ DISPONIBLE' : '❌ VENDIDO'}
                </p>
                <button class="comprar-btn ${p.disponible ? 'btn-disponible' : 'btn-vendido'}" 
                    ${!p.disponible ? 'disabled' : ''} 
                    onclick="comprarDirecto(${p.id}, '${p.nombre.replace(/'/g, "\\'")}', ${p.numero}, ${p.tallaUnica}, ${p.precio})">
                    ${p.disponible ? '🛒 COMPRAR ESTE' : 'AGOTADO'}
                </button>
            </div>
        </div>`;
    });
    
    if (!grid.innerHTML) {
        grid.innerHTML = `<p style="text-align:center; color:#888; padding:40px;">No hay modelos disponibles en esta talla 😊</p>`;
    }
}

function comprarDirecto(id, nombre, numero, talla, precio) {
    const enlaceConProducto = `${window.location.origin}${window.location.pathname}#tenis-${id}`;
    const msg = encodeURIComponent(
        `Hola! 👟 Me interesa este modelo:\n\n` +
        `🔢 Modelo #${numero}\n` +
        `📦 Nombre: ${nombre}\n` +
        `👞 Talla: ${talla}\n` +
        `💰 Precio: ${precio} Bs\n\n` +
        `🔗 Ver directo: ${enlaceConProducto}\n\nQuedo atento para el pago y entrega ✅`
    );
    window.open(`https://wa.me/${TU_WHATSAPP}?text=${msg}`);
}
</script>
</body>
</html>

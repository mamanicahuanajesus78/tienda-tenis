<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>👟 Tienda de Tenis</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0;}
        body {font-family: system-ui; background: #0f172a; color: white;}
        .contenedor {max-width: 1200px; margin: 0 auto; padding: 20px;}
        header {text-align: center; margin-bottom: 30px;}
        h1 {font-size: 26px;}
        .subtitulo {color: #94a3b8; margin-top: 8px;}

        /* QR + LUPITA */
        .contenedor-qr {position: relative; display: inline-block; margin: 15px 0;}
        .qr-img {max-width: 240px; width: 80%; border-radius: 12px; border: 3px solid rgba(34,211,238,0.3); display: block; margin: 0 auto;}
        .lupa-btn {position: absolute; top: 50%; right: -5px; transform: translateY(-50%); background: #22d3ee; color: #000; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(34,211,238,0.5);}
        
        .pago {text-align: center; margin-bottom: 30px;}
        .dato {font-size: 16px; margin: 8px 0;}

        /* BOTONES DE TALLAS — LIMPIOS */
        .filtros {display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0 30px; min-height: 50px;}
        .talla-btn {padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #1e293b; color: white;}
        .talla-btn.activo {background: linear-gradient(90deg, #22d3ee, #10b981); color: #000;}

        /* PRODUCTOS */
        .grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;}
        .producto {background: #1e293b; border-radius: 12px; padding: 15px; border: 2px solid transparent; transition: all 0.3s;}
        .producto.destacado {border-color: #22d3ee; box-shadow: 0 0 25px rgba(34,211,238,0.4);}
        .prod-img {width: 100%; border-radius: 8px; margin-bottom: 10px;}
        .numero-etiqueta {display: inline-block; background: #22d3ee; color: #000; font-weight: bold; padding: 2px 8px; border-radius: 12px; font-size: 13px; margin-right: 6px;}
        .prod-nombre {font-size: 15px; margin-bottom: 6px;}
        .prod-precio {color: #22d3ee; font-weight: bold; font-size: 18px; margin: 6px 0;}
        .prod-talla {font-size: 14px; color: #94a3b8;}
        .disponible {color: #10b981; margin: 8px 0;}
        .vendido {color: #ef4444; margin: 8px 0;}
        .comprar-btn {width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 8px;}
        .btn-disponible {background: linear-gradient(90deg, #22d3ee, #10b981); color: #000;}
        .btn-vendido {background: #333; color: #888; cursor: not-allowed;}

        /* QR GRANDE */
        .ventana-qr-grande {position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; padding: 20px;}
        .qr-grande-imagen {max-width: 90%; max-height: 70vh; border-radius: 12px; border: 4px solid #22d3ee;}
        .btn-cerrar-qr {background: #ef4444; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer;}
        
        footer {text-align: center; margin-top: 40px; color: #64748b; font-size: 14px;}
    </style>
</head>
<body>
<div class="contenedor">
    <header>
        <h1>👟 TIENDA DE TENIS</h1>
        <p class="subtitulo">Modelos únicos — Elige y compra directo 🚀</p>
    </header>

    <div class="pago" id="seccion-pago">
        <h3>💳 FORMA DE PAGO</h3>
        <p class="dato"><strong>Nombre:</strong> <span id="nombre-dato"></span></p>
        <p class="dato"><strong id="banco-titulo"></strong>: <span id="banco-dato"></span></p>
        
        <div class="contenedor-qr">
            <img src="" alt="Código QR de Pago" class="qr-img" id="qr-imagen">
            <button class="lupa-btn" onclick="abrirQRgrande()">🔍</button>
        </div>
        
        <p style="margin-top:15px; font-size:15px; color:#94a3b8;">📱 Escanea el QR → paga → manda comprobante por WhatsApp</p>
        <p style="margin-top:10px; color:#10b981; font-weight:bold;" id="entrega-dato"></p>
    </div>

    <div class="filtros" id="filtros-tallas"></div>
    <div class="grid" id="productos"><p style="text-align:center; color:#888; padding:40px;">Cargando...</p></div>

    <footer>
        💬 Al comprar te escribo por WhatsApp y coordinamos la entrega 🚚<br><br>
        <a href="admin.html" style="color:#22d3ee;">🔐 Panel de Administración</a>
    </footer>
</div>

<div class="ventana-qr-grande" id="ventanaQR" onclick="cerrarQRgrande()">
    <img src="" alt="QR en grande" class="qr-grande-imagen" id="qr-imagen-grande">
    <button class="btn-cerrar-qr">✖ Cerrar</button>
</div>

<script src="datos.js"></script>
<script>
let productos = [...DATOS_INICIALES];
let filtroActivo = 'todos';

// Numerar
productos.forEach((p, i) => p.numero = i + 1);

// ✅ SOLO TALLAS DE PRODUCTOS DISPONIBLES
function obtenerTallasDisponibles() {
    const vistas = {};
    productos.filter(p => p.disponible).forEach(p => {
        vistas[p.tallaUnica] = true;
    });
    return Object.keys(vistas).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
}

// ✅ REDIBUJAR BOTONES DESDE CERO
function dibujarBotonesTallas() {
    const c = document.getElementById('filtros-tallas');
    c.innerHTML = ''; // BORRA TODO COMPLETAMENTE
    
    const tallas = obtenerTallasDisponibles();
    
    // Botón Todos
    const todos = document.createElement('button');
    todos.className = `talla-btn ${filtroActivo==='todos'?'activo':''}`;
    todos.textContent = 'Todos';
    todos.onclick = () => { filtroActivo='todos'; dibujarBotonesTallas(); mostrarProductos(); };
    c.appendChild(todos);
    
    // Botones de talla
    tallas.forEach(t => {
        const btn = document.createElement('button');
        btn.className = `talla-btn ${filtroActivo==t?'activo':''}`;
        btn.textContent = t;
        btn.onclick = () => { filtroActivo=t; dibujarBotonesTallas(); mostrarProductos(); };
        c.appendChild(btn);
    });
}

function mostrarPago() {
    document.getElementById('nombre-dato').textContent = DATOS_PAGO.nombre;
    document.getElementById('banco-titulo').textContent = DATOS_PAGO.banco;
    document.getElementById('banco-dato').textContent = DATOS_PAGO.numeroCuenta;
    document.getElementById('qr-imagen').src = DATOS_PAGO.qrImagen;
    document.getElementById('qr-imagen-grande').src = DATOS_PAGO.qrImagen;
    document.getElementById('entrega-dato').textContent = DATOS_PAGO.entrega;
}

function abrirQRgrande() {
    document.getElementById('ventanaQR').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}
function cerrarQRgrande() {
    document.getElementById('ventanaQR').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function mostrarProductos() {
    const grid = document.getElementById('productos');
    grid.innerHTML = '';
    
    productos.forEach(p => {
        if (filtroActivo !== 'todos' && p.tallaUnica !== filtroActivo) return;
        
        grid.innerHTML += `
        <div class="producto" data-id="${p.id}">
            <img src="${p.imagen}" class="prod-img" alt="${p.nombre}">
            <h4 class="prod-nombre"><span class="numero-etiqueta">#${p.numero}</span>${p.nombre}</h4>
            <p class="prod-precio">${p.precio} Bs</p>
            <span class="prod-talla">👟 Talla ${p.tallaUnica}</span>
            <p class="${p.disponible?'disponible':'vendido'}">${p.disponible?'✅ DISPONIBLE':'❌ VENDIDO'}</p>
            <button class="comprar-btn ${p.disponible?'btn-disponible':'btn-vendido'}" 
                ${!p.disponible?'disabled':''}
                onclick="comprarDirecto(${p.id},'${p.nombre.replace(/'/g,"\\'")}',${p.numero},${p.tallaUnica},${p.precio})">
                ${p.disponible?'🛒 COMPRAR ESTE':'AGOTADO'}
            </button>
        </div>`;
    });
    
    if (!grid.innerHTML) {
        grid.innerHTML = '<p style="text-align:center; color:#888; padding:40px;">No hay modelos en esta talla 😊</p>';
    }
    
    // Destacar si viene del enlace
    setTimeout(() => {
        const hash = window.location.hash;
        if (!hash) return;
        const el = document.querySelector(`[data-id="${hash.replace('#tenis-','')}"]`);
        if (el) {
            el.scrollIntoView({behavior:'smooth', block:'center'});
            el.classList.add('destacado');
            setTimeout(()=>el.classList.remove('destacado'),4000);
        }
    }, 100);
}

function comprarDirecto(id, nombre, numero, talla, precio) {
    const enlace = window.location.origin + window.location.pathname + '#tenis-' + id;
    const msg = encodeURIComponent(
        `Hola! 👟 Me interesa este modelo:\n\n` +
        `🔢 Modelo #${numero}\n📦 ${nombre}\n👞 Talla ${talla}\n💰 ${precio} Bs\n\n🔗 Ver directo: ${enlace}`
    );
    window.open(`https://wa.me/${59161159473}?text=${msg}`);
}

// INICIAR TODO
mostrarPago();
dibujarBotonesTallas();
mostrarProductos();
</script>
</body>
</html>

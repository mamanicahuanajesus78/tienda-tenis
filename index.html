<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Tienda de Tenis — Modelos Únicos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 20px; }
        h1 { font-size: 2rem; background: linear-gradient(90deg, #00f0ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitulo { color: #94a3b8; margin-top: 10px; }

        /* Filtros */
        .filtros { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .btn-filtro { padding: 10px 20px; border: none; border-radius: 25px; background: #334155; color: #fff; cursor: pointer; transition: all 0.3s; }
        .btn-filtro.activo { background: linear-gradient(90deg, #00f0ff, #00ff88); color: #000; font-weight: bold; }

        /* QR */
        .seccion-pago { background: #1e293b; border-radius: 16px; padding: 25px; margin: 30px 0; text-align: center; }
        .qr-contenedor { position: relative; display: inline-block; }
        .qr-img { max-width: 280px; width: 85%; border-radius: 12px; margin: 15px auto; display: block; border: 3px solid rgba(0,240,255,0.3); box-shadow: 0 0 20px rgba(0,240,255,0.2); cursor: zoom-in; transition: transform 0.3s; }
        .qr-img:hover { transform: scale(1.02); }
        .lupa-qr { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qr-grande { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .qr-grande.activo { display: flex; }
        .qr-grande img { max-width: 90%; max-height: 90%; border-radius: 12px; }
        .cerrar-qr { position: absolute; top: 20px; right: 30px; font-size: 30px; color: #fff; cursor: pointer; }

        /* Grid Tenis */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin: 30px 0; }
        .tarjeta { background: #1e293b; border-radius: 16px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; border: 2px solid transparent; }
        .tarjeta:target { border-color: #00f0ff; box-shadow: 0 0 30px rgba(0,240,255,0.4); animation: resaltar 1.5s ease; }
        @keyframes resaltar { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .tarjeta:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,240,255,0.15); }
        .tarjeta.vendido { opacity: 0.6; }
        .etiqueta-vendido { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; z-index: 2; }
        .img-tenis { width: 100%; height: 220px; object-fit: cover; }
        .contenido { padding: 15px; }
        .numero { font-size: 0.85rem; color: #00f0ff; font-weight: bold; margin-bottom: 5px; }
        .nombre { font-size: 1.1rem; margin-bottom: 8px; }
        .talla { color: #94a3b8; font-size: 0.9rem; margin-bottom: 10px; }
        .precio { font-size: 1.3rem; font-weight: bold; color: #00ff88; margin-bottom: 15px; }
        .btn-wsp { width: 100%; padding: 12px; background: linear-gradient(90deg, #25d366, #128c7e); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .btn-wsp:hover { transform: scale(1.03); }
        .admin-link { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: #94a3b8; padding: 8px 12px; border-radius: 20px; text-decoration: none; font-size: 0.8rem; z-index: 100; }
        .admin-link:hover { color: #00f0ff; }
        .sin-resultados { text-align: center; padding: 50px; color: #94a3b8; }
    </style>
</head>
<body>

<a href="admin.html" class="admin-link" title="Panel de Administración">👤</a>

<div class="container">
    <header>
        <h1>👟 Tienda de Tenis</h1>
        <p class="subtitulo">Modelos únicos — Entregas: Sábados — Ceibo / Uyuni</p>
    </header>

    <!-- Sección de Pago -->
    <div class="seccion-pago">
        <h2>💳 Formas de Pago</h2>
        <p><strong>Nombre:</strong> Jesus Mamani Cahuana</p>
        <p><strong>Yape:</strong> 63228616</p>
        <div class="qr-contenedor">
            <img src="tu-qr.jpg" alt="QR de Pago" class="qr-img" id="qrImagen">
            <button class="lupa-qr" onclick="abrirQRGrande()">🔍</button>
        </div>
        <p style="color:#94a3b8; font-size:0.9rem;">Escanea o guarda el QR para pagar</p>
    </div>

    <!-- QR Grande -->
    <div class="qr-grande" id="qrGrande" onclick="cerrarQRGrande()">
        <span class="cerrar-qr">&times;</span>
        <img src="tu-qr.jpg" alt="QR Agrandado">
    </div>

    <!-- Filtros -->
    <div class="filtros">
        <button class="btn-filtro activo" data-talla="todos">Todos</button>
        <button class="btn-filtro" data-talla="20">Talla 20</button>
        <button class="btn-filtro" data-talla="38">Talla 38</button>
        <button class="btn-filtro" data-talla="39">Talla 39</button>
        <button class="btn-filtro" data-talla="40">Talla 40</button>
        <button class="btn-filtro" data-talla="41">Talla 41</button>
    </div>

    <!-- Lista de Tenis -->
    <div class="grid" id="gridTenis"></div>
    <div class="sin-resultados" id="sinResultados" style="display:none;">No hay tenis disponibles en esta talla</div>
</div>

<script>
// ==============================================
// ✅ TUS DATOS — EDITA AQUÍ SI CAMBIAS ALGO
// ==============================================
const TU_WHATSAPP = "59161159473"; // Tu número con código de país
const listaTenis = [
  // EJEMPLO — Aquí se cargarán los tenis desde el panel
  // El panel los agrega automáticamente aquí
];

// ==============================================
// ✅ NO MODIFICAR DESDE AQUÍ
// ==============================================
let filtroActivo = "todos";

// Cargar datos guardados desde el panel
function cargarDatos() {
  const guardado = localStorage.getItem('tenisTienda');
  if (guardado) {
    listaTenis.length = 0;
    listaTenis.push(...JSON.parse(guardado));
  }
}

// Renderizar tenis
function mostrarTenis() {
  const grid = document.getElementById('gridTenis');
  const sinResultados = document.getElementById('sinResultados');
  grid.innerHTML = '';

  const filtrados = filtroActivo === "todos" 
    ? listaTenis 
    : listaTenis.filter(t => t.talla === filtroActivo);

  if (filtrados.length === 0) {
    sinResultados.style.display = 'block';
    return;
  }
  sinResultados.style.display = 'none';

  filtrados.forEach((tenis, indice) => {
    const numeroReal = listaTenis.findIndex(t => t.id === tenis.id) + 1;
    const tarjeta = document.createElement('div');
    tarjeta.className = `tarjeta ${tenis.vendido ? 'vendido' : ''}`;
    tarjeta.id = `tenis-${tenis.id}`;

    tarjeta.innerHTML = `
      ${tenis.vendido ? '<span class="etiqueta-vendido">VENDIDO</span>' : ''}
      <img src="${tenis.imagen}" alt="${tenis.nombre}" class="img-tenis" loading="lazy">
      <div class="contenido">
        <span class="numero">Nº ${numeroReal}</span>
        <h3 class="nombre">${tenis.nombre}</h3>
        <p class="talla">👞 Talla: ${tenis.talla}</p>
        <p class="precio">💰 ${tenis.precio} Bs</p>
        ${!tenis.vendido 
          ? `<button class="btn-wsp" onclick="comprar('${tenis.id}', '${tenis.nombre.replace(/'/g, "\\'")}', '${tenis.talla}', '${tenis.precio}')">💬 Preguntar por WhatsApp</button>` 
          : '<p style="color:#ef4444; text-align:center; font-weight:bold;">Reservado</p>'}
      </div>
    `;
    grid.appendChild(tarjeta);
  });
}

// Función de compra con NÚMERO y ENLACE DIRECTO
function comprar(id, nombre, talla, precio) {
  const numero = listaTenis.findIndex(t => t.id === id) + 1;
  const enlaceDirecto = window.location.origin + window.location.pathname + '#tenis-' + id;

  const mensaje = encodeURIComponent(
    `Hola! 👟 Me interesa este modelo:\n\n` +
    `🔢 Nº ${numero}\n` +
    `📦 ${nombre}\n` +
    `👞 Talla: ${talla}\n` +
    `💰 Precio: ${precio} Bs\n\n` +
    `🔗 Ver tenis: ${enlaceDirecto}\n\n` +
    `Quedo atento para el pago y entrega. Gracias!`
  );

  window.open(`https://wa.me/${TU_WHATSAPP}?text=${mensaje}`, '_blank');
}

// Filtros
document.querySelectorAll('.btn-filtro').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    filtroActivo = btn.dataset.talla;
    mostrarTenis();
  });
});

// QR Agrandado
function abrirQRGrande() {
  document.getElementById('qrGrande').classList.add('activo');
}
function cerrarQRGrande() {
  document.getElementById('qrGrande').classList.remove('activo');
}

// Iniciar
cargarDatos();
mostrarTenis();
</script>
</body>
</html>
